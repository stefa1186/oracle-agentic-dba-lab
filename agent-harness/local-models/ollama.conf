# -----------------------------------------------------------------------------
# ollama.conf: settings shared by every script in local-models/.
# Sourced by the scripts; contains no secrets, so it is committed to git.
# Any value can be overridden for one run from the environment, e.g.:
#   OLLAMA_PORT=11435 ./01_start_ollama.sh
# -----------------------------------------------------------------------------

# Container image, pinned to one version AND its digest, the same way you'd
# pin a Release Update instead of always taking the newest one. 0.40.9 was
# built on 2026-10-23; the digest is that of its multi-platform image index.
# To upgrade: change both, rerun 01_start_ollama.sh (it recreates the
# container; the downloaded models are kept).
OLLAMA_IMAGE="${OLLAMA_IMAGE:-docker.io/ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc}"

# Name of the container (the "instance").
OLLAMA_CONTAINER="${OLLAMA_CONTAINER:-lab-ollama}"

# Name of the volume holding downloaded models (the "datafiles"). It survives
# container removal unless 99_remove_ollama.sh is run with --purge.
OLLAMA_VOLUME="${OLLAMA_VOLUME:-lab-ollama-models}"

# Host port for the API. Published on 127.0.0.1 only, so nothing outside this
# server can reach the model, like a listener bound to localhost.
OLLAMA_PORT="${OLLAMA_PORT:-11434}"

# Default context window, in tokens, for every model the server loads.
# Ollama's built-in default is small; agent runs with long SQL output need more.
# Larger values need more RAM. Think of it as sizing the model's PGA.
OLLAMA_CONTEXT_LENGTH="${OLLAMA_CONTEXT_LENGTH:-32768}"

# How many requests one loaded model serves at the same time. Each parallel
# slot gets its own context memory, so 1 keeps memory predictable. The agent
# sends one request at a time anyway.
OLLAMA_NUM_PARALLEL="${OLLAMA_NUM_PARALLEL:-1}"
# How many models may be in memory at the same time. 1: loading the next model
# unloads the previous one, so two large models never compete for RAM with
# each other (or with the database).
OLLAMA_MAX_LOADED_MODELS="${OLLAMA_MAX_LOADED_MODELS:-1}"
# Memory cap for the container (Podman --memory syntax, e.g. 16g). Empty = no cap.
OLLAMA_MEMORY="${OLLAMA_MEMORY:-}"

# Set to 1 to pass NVIDIA GPUs to the container (needs the NVIDIA Container
# Toolkit with CDI configured). 0 = CPU only: works everywhere, but is slow.
OLLAMA_GPU="${OLLAMA_GPU:-0}"
